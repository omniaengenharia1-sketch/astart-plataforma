# Publica as cinco Edge Functions no projeto Supabase a cada merge na main.
#
# Irma da migrations.yml, e pelo mesmo motivo: ninguem sobe funcao na mao. O
# que esta em supabase/functions e o que roda em producao, e nada mais.
#
# Precisa de dois segredos no repositorio (Settings > Secrets and variables >
# Actions). Note que NAO precisa da senha do banco, ao contrario da
# migrations.yml: publicar funcao nao toca no schema.
#   SUPABASE_ACCESS_TOKEN  — gerado em supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — o Reference ID do projeto, que e publico
name: funcoes

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/funcoes.yml']
  workflow_dispatch:

concurrency:
  group: funcoes-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que os segredos estao configurados
        run: |
          faltam=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || faltam="$faltam SUPABASE_ACCESS_TOKEN"
          [ -n "$REF" ]                   || faltam="$faltam SUPABASE_PROJECT_REF"
          if [ -n "$faltam" ]; then
            echo "Faltam estes segredos no repositorio:$faltam"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Erro de tipo descoberto aqui custa um minuto de CI. Descoberto depois
      # do deploy, custa uma funcao quebrada em producao esperando o cron.
      - name: Conferir os tipos antes de publicar
        working-directory: supabase/functions
        # VARRE, nao lista. A lista por nome era um alcapao: funcao nova
        # nao entrava nela, e passava sem nenhuma conferencia de tipo ate
        # quebrar em producao. Percebi ao escrever a `avisar-tarefa` — ela
        # nao estava na lista e teria ido ao ar sem `deno check`.
        run: deno check */index.ts

      # `deno check` prova tipo; isto prova COMPORTAMENTO. Entrou porque os dois
      # piores erros deste modulo passariam pelos tipos sem reclamar: o
      # adaptador publicando so um dos quatro formatos oferecidos na tela, e o
      # token da agencia indo para o log numa URL de GET.
      - name: Rodar os testes de unidade
        working-directory: supabase/functions
        run: deno test --allow-env

      # A conferencia das tres copias da regra de formato MUDOU DE ESTEIRA,
      # e esta agora no fim da `migrations.yml`.
      #
      # Ela ficou vermelha aqui num commit correto: as duas esteiras disparam
      # juntas no mesmo push, e esta leu o banco de producao antes de a
      # `migrations` ter aplicado a migration que liberava o formato novo. O
      # prover estava certo e o lugar estava errado — ele compara codigo com o
      # BANCO, e a unica hora em que a resposta vale e depois de aplicar.

      # VERSAO FIXA, nao `latest`.
      #
      # Esta esteira ficou vermelha sem ninguem ter mexido nela: a CLI passou a
      # PEDIR CONFIRMACAO antes de publicar, e num runner nao ha terminal para
      # responder ("Nothing was changed. Re-run with --yes"). O `--yes` abaixo
      # resolve ESSA mudanca; fixar a versao resolve a classe.
      #
      # Eu tinha deixado `latest` com um comentario dizendo que era de
      # proposito. Nao era: era a mesma falha de sempre deste projeto — um
      # caminho que muda sozinho debaixo da verificacao. `latest` significa que
      # a esteira pode quebrar num dia em que ninguem encostou no codigo, e o
      # tempo gasto procurando a causa e sempre maior que o de subir a versao
      # a mao.
      #
      # Para atualizar: troque o numero, deixe a esteira rodar, e so entao
      # confie. Uma versao nova que quebra aqui quebra ANTES de producao.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # NENHUMA FUNCAO FICA DE FORA EM SILENCIO.
      #
      # As listas abaixo continuam escritas a mao, e isso e de proposito: se
      # uma funcao exige JWT ou nao e decisao de seguranca, e decisao de
      # seguranca nao se deduz de nome de pasta. O que NAO pode e uma funcao
      # existir no disco e nao estar em lista nenhuma — foi o que quase
      # aconteceu com a `avisar-tarefa`, que o `deno check` tambem pulava
      # porque ele listava por nome.
      #
      # Entao este passo compara o disco com as listas e PARA se sobrar
      # alguma. Esquecer de declarar vira esteira vermelha com instrucao, em
      # vez de funcao que nunca sobe e ninguem percebe.
      - name: Conferir que toda funcao esta declarada
        working-directory: supabase/functions
        run: |
          SEM_JWT="publicar-tick renovar-tokens avisar-tarefa galeria aprovar"
          COM_JWT="convidar conectar-conta"
          faltam=""
          for d in */; do
            f="${d%/}"
            [ "$f" = "_shared" ] && continue
            case " $SEM_JWT $COM_JWT " in
              *" $f "*) ;;
              *) faltam="$faltam $f" ;;
            esac
          done
          if [ -n "$faltam" ]; then
            echo "Estas funcoes existem e nao estao declaradas no deploy:$faltam"
            echo "Acrescente cada uma a SEM_JWT ou a COM_JWT em .github/workflows/funcoes.yml."
            echo "A escolha e de seguranca: SEM_JWT so para quem confere quem pediu por"
            echo "outro meio (x-tick-secret do cron, ou token de link conferido no banco)."
            exit 1
          fi
          echo "Todas as funcoes do disco estao declaradas."

      # Quem autoriza estas cinco nao e o JWT:
      #   publicar-tick, renovar-tokens
      #   e avisar-tarefa      — o header x-tick-secret, que o cron manda
      #   galeria e aprovar    — o token do link, conferido no banco
      - name: Publicar as que nao usam JWT
        run: |
          for f in publicar-tick renovar-tokens avisar-tarefa galeria aprovar; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$REF" --no-verify-jwt --yes
            echo "::endgroup::"
          done

      # Estas duas sao a excecao, e e de proposito: elas DESCOBREM quem pediu
      # pelo JWT, e e por ele que conferem se e admin. Sem JWT, a convidar
      # viraria porta aberta para criar convite, e a conectar-conta deixaria
      # qualquer um ligar a conta de rede social de um cliente.
      - name: Publicar as que exigem JWT
        run: |
          for f in convidar conectar-conta; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$REF" --yes
            echo "::endgroup::"
          done

      - name: Listar o que ficou publicado
        run: supabase functions list --project-ref "$REF"
