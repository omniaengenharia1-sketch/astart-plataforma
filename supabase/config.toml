# Configuracao minima do projeto Supabase para o modulo de agendamento.
# O restante fica nos defaults da CLI.

project_id = "astart-agendamento"

[functions.publicar-tick]
# O pg_cron autentica com o header x-tick-secret, nao com JWT.
verify_jwt = false

[functions.renovar-tokens]
# Autentica pelo header x-tick-secret, igual ao publicar-tick.
verify_jwt = false

[functions.convidar]
# Ao contrario das duas acima, esta PRECISA do JWT: e por ele que a funcao
# descobre quem esta convidando e confere se e admin.
verify_jwt = true

[functions.galeria]
# A porta do link sem conta: quem abre nao tem login nenhum. Quem autoriza e o
# token, conferido dentro do banco contra o hash guardado.
verify_jwt = false

[functions.aprovar]
# Mesmo caso da galeria: o cliente recebe o endereco no WhatsApp e responde sem
# conta. Quem autoriza e o token, conferido no banco contra o hash.
verify_jwt = false

[functions.conectar-conta]
# Como a convidar: o JWT e quem diz se quem pediu e direcao. Conectar a conta de
# um cliente mexe no Business Manager da agencia e no token compartilhado.
verify_jwt = true
