<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma Astart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --papel:#faf9f7; --tinta:#1c1b19; --linha:#cdcac5; --linha2:#e4e1dd;
  --mudo:#8d8a85; --bloco:#f2f0ed; --fraco:#e0ddd8; --apagado:#b4b0aa;
  --sup:#ffffff; --fraco2:#eeebe7; --texto2:#55524e; --pisca:#d6d3ce;
  --gut:48px; --barra:46px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --papel:#141311; --tinta:#efece7; --linha:#3b3833; --linha2:#2b2824;
  --mudo:#918c84; --bloco:#1d1b18; --fraco:#2b2824; --apagado:#6b665f;
  --sup:#1a1815; --fraco2:#26231f; --texto2:#b8b2a9; --pisca:#3b3833; color-scheme:dark; } }
:root[data-theme="dark"]{
  --papel:#141311; --tinta:#efece7; --linha:#3b3833; --linha2:#2b2824;
  --mudo:#918c84; --bloco:#1d1b18; --fraco:#2b2824; --apagado:#6b665f;
  --sup:#1a1815; --fraco2:#26231f; --texto2:#b8b2a9; --pisca:#3b3833; color-scheme:dark; }
@media (max-width:1024px){ :root{ --gut:28px; } }
@media (max-width:640px){ :root{ --gut:18px; } }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--papel);color:var(--tinta);
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--barra) + env(safe-area-inset-bottom));}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;}
h1{font-size:28px;} h2{font-size:19px;} h3{font-size:16px;}
@media (max-width:640px){ h1{font-size:23px;} }
p{margin:0;}

.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
.rot,.rot-ink{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;}
.rot{color:var(--mudo);} .rot-ink{color:var(--tinta);}
.mudo{color:var(--mudo);} .nota{font-size:12px;color:var(--mudo);}
.gut{padding-left:var(--gut);padding-right:var(--gut);}
.fio{border:1px solid var(--linha);}
.caixa{border:1px solid var(--linha);background:var(--sup);}
.forte{border:2px solid var(--tinta);background:var(--sup);}
.manchete{font-size:38px;line-height:1.1;letter-spacing:-.025em;}
@media (max-width:1024px){ .manchete{font-size:30px;} }
@media (max-width:640px){ .manchete{font-size:25px;} }

.campo{border:1px solid var(--linha);background:var(--sup);min-height:40px;
  display:flex;align-items:center;padding:0 11px;font-size:13px;}
.vazio{border:1px dashed var(--linha);background:var(--bloco);min-height:40px;
  display:flex;align-items:center;padding:0 11px;font-size:13px;color:var(--apagado);}
.area{border:1px solid var(--linha);background:var(--sup);min-height:84px;padding:10px 12px;
  font-size:13px;color:var(--apagado);}

.btn,.btn2,.btnoff{border:1px solid var(--tinta);min-height:44px;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;padding:0 18px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;background:var(--tinta);color:var(--papel);
  user-select:none;-webkit-tap-highlight-color:transparent;text-align:center;}
.btn2{background:transparent;color:var(--tinta);}
.btnoff{background:var(--fraco2);color:var(--apagado);border-color:var(--pisca);cursor:not-allowed;}
.btn.sm,.btn2.sm,.btnoff.sm{min-height:34px;padding:0 13px;}
.btn:active,.btn2:active{transform:translateY(1px);}
.acaoBtn{border:1px solid var(--tinta);background:var(--sup);color:var(--tinta);min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 15px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.acaoBtn.fraca{border-color:var(--linha);color:var(--mudo);}
.seg{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;border:1px solid var(--linha);padding:11px 16px;color:var(--mudo);
  background:var(--sup);cursor:pointer;white-space:nowrap;}
.seg.on{border-color:var(--tinta);color:var(--papel);background:var(--tinta);}
.tag{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;border:1px solid var(--linha);padding:3px 7px;color:var(--mudo);
  white-space:nowrap;display:inline-block;}
.tag.on{border-color:var(--tinta);color:var(--tinta);}
.selo{background:var(--tinta);color:var(--papel);font-size:9px;padding:1px 5px;letter-spacing:.06em;
  font-family:'IBM Plex Mono',ui-monospace,monospace;}
.barrinha{background:var(--fraco);height:9px;} .barrinha.f{background:var(--linha);}

/* chrome */
.nameplate{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:18px var(--gut) 13px;border-bottom:2px solid var(--tinta);}
.nameplate .marca{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;}
@media (max-width:640px){ .nameplate .marca{font-size:20px;} .nameplate .quem{display:none;} }
.menu{display:flex;gap:22px;padding:11px var(--gut);border-bottom:1px solid var(--linha);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.menu::-webkit-scrollbar{display:none;}
.menu > *{white-space:nowrap;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;gap:7px;}
.menu .on{color:var(--tinta);border-bottom:2px solid var(--tinta);padding-bottom:2px;}
.abas{background:var(--bloco);}
.tituloCliente{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px var(--gut) 14px;}
.tituloCliente b{font-size:20px;font-weight:600;letter-spacing:-.015em;}

.cabeca{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:28px var(--gut) 20px;}
.cabeca .acoes{display:flex;gap:10px;flex-wrap:wrap;}

/* grades */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}
@media (max-width:1024px){ .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:640px){ .g2,.g3,.g4{grid-template-columns:1fr;} }
.split{display:grid;gap:32px;align-items:start;}
@media (max-width:1024px){ .split{grid-template-columns:1fr !important;gap:24px;} }
.campos4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}
@media (max-width:1024px){ .campos4{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:560px){ .campos4{grid-template-columns:1fr;} }

/* tabela responsiva */
.tab{width:100%;border-collapse:collapse;}
.tab th{text-align:left;padding:10px 14px 10px 0;border-bottom:2px solid var(--tinta);}
.tab td{padding:14px 14px 14px 0;border-bottom:1px solid var(--linha2);vertical-align:top;}
.tab td:last-child,.tab th:last-child{padding-right:0;}
@media (max-width:860px){
  .tab,.tab tbody,.tab tr,.tab td{display:block;width:100%;}
  .tab thead{display:none;}
  .tab tr{border:1px solid var(--linha);background:var(--sup);padding:14px 16px;margin-bottom:10px;}
  .tab td{border:0;padding:3px 0;}
  .tab td[data-r]:before{content:attr(data-r);display:block;
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mudo);margin-bottom:2px;}
}
/* lista */
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--linha2);}
.li:last-child{border-bottom:0;}
.li .cr{flex:1;min-width:0;}
.secao{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinta);border-bottom:2px solid var(--tinta);padding-bottom:10px;
  margin-bottom:4px;}
.rodape{margin:26px var(--gut) 0;border-top:1px solid var(--linha);padding-top:14px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.fimTela{height:44px;}
.acaoBarra{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  margin:20px var(--gut) 0;border-top:2px solid var(--tinta);padding-top:18px;}
@media (max-width:640px){
  .acaoBarra{position:sticky;bottom:calc(var(--barra) + env(safe-area-inset-bottom));
    background:var(--papel);margin:16px 0 0;padding:14px var(--gut);}
  .acaoBarra .btn{width:100%;}
}
.clicavel{cursor:pointer;}
.protolink{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--apagado);border-bottom:1px dashed var(--apagado);cursor:pointer;}

/* específicos */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - var(--barra));}
.loginMarca{background:var(--bloco);border-right:1px solid var(--linha);padding:var(--gut);
  display:flex;flex-direction:column;justify-content:space-between;}
.loginArte{border:1px dashed var(--linha);flex:1 1 auto;margin:40px 0;display:flex;
  align-items:center;justify-content:center;min-height:120px;}
.loginForm{display:flex;align-items:center;justify-content:center;padding:var(--gut);}
.loginForm > div{width:100%;max-width:380px;}
@media (max-width:860px){
  .login{grid-template-columns:1fr;min-height:0;}
  .loginMarca{border-right:0;border-bottom:1px solid var(--linha);flex-direction:row;
    align-items:center;justify-content:space-between;padding:20px var(--gut);}
  .loginArte{display:none;} .loginForm{padding:34px var(--gut) 40px;}
}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border-left:1px solid var(--linha);border-top:1px solid var(--linha);}
.mesCab{padding:9px 10px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);
  background:var(--bloco);}
.mesCel{min-height:116px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);
  padding:8px 9px;}
.mesCel.vaziaCel{background:var(--bloco);}
.hoje{font-weight:600;border-bottom:2px solid var(--tinta);display:inline-block;padding-bottom:1px;}
.dias{display:none;}
.diaLinha{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--linha2);}
.diaSelo{width:44px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:2px;}
@media (max-width:860px){ .mes{display:none;} .dias{display:block;} }
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;}
.tile{aspect-ratio:4/5;padding:9px;display:flex;flex-direction:column;justify-content:space-between;}
.tiles.tiktok .tile{aspect-ratio:9/16;}
.tileTit{font-size:11px;line-height:1.3;color:var(--texto2);}
@media (max-width:640px){ .tile{padding:7px;} .tileTit{font-size:10px;} }
.entLinha{display:flex;align-items:center;gap:12px;background:var(--sup);padding:13px 16px;
  margin-bottom:6px;border:1px solid var(--linha);border-left:3px solid var(--linha);}
.entLinha.q{border:2px solid var(--tinta);border-left:3px solid var(--tinta);}
.entLinha.f{border-left-color:var(--tinta);}
.entLinha.off{color:var(--apagado);}
.itemAprov{display:flex;align-items:center;gap:18px;padding:16px 22px;}
@media (max-width:760px){
  .itemAprov{flex-wrap:wrap;gap:12px;}
  .itemAprov .acoes{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .itemAprov .acoes > *:first-child{grid-column:1/-1;}
}
.trilha{display:flex;gap:3px;}
.trilha > i{flex:1;height:8px;background:var(--fraco);}
.trilha > i.ok{background:var(--tinta);} .trilha > i.agora{background:var(--linha);}
.passos{display:flex;align-items:center;gap:10px;padding:14px var(--gut);
  border-bottom:1px solid var(--linha);overflow-x:auto;scrollbar-width:none;}
.passos::-webkit-scrollbar{display:none;}
.passos > *{white-space:nowrap;flex:0 0 auto;}
.dropzone{border:1px dashed var(--apagado);background:var(--bloco);padding:32px 18px;
  display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer;text-align:center;}
.marco{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--linha2);}
.marcoSelo{width:52px;flex:0 0 auto;text-align:center;}
.fotos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;}
@media (max-width:860px){ .fotos{grid-template-columns:repeat(4,minmax(0,1fr));} }
@media (max-width:520px){ .fotos{grid-template-columns:repeat(3,minmax(0,1fr));} }
.foto{aspect-ratio:1;background:var(--fraco);border:1px solid var(--linha);}
@media (max-width:1024px){ #portas{grid-template-columns:1fr !important;} }
@media (max-width:760px){ #acoesCli{grid-template-columns:1fr !important;} }
.tabsMob{display:none;gap:0;margin:0 var(--gut) 18px;}
.tabsMob > span{flex:1;text-align:center;border:1px solid var(--linha);padding:12px 0;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mudo);background:var(--sup);cursor:pointer;}
.tabsMob > span.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta);}
@media (max-width:1024px){
  .tabsMob{display:flex;}
  #conferir .ladoPdf{display:none;}
  #conferir.verPdf .ladoPdf{display:block;}
  #conferir.verPdf .ladoCampos{display:none;}
  .previa{margin-left:auto;margin-right:auto;}
}
.linhaCampo{display:grid;grid-template-columns:22px 148px 1fr;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--linha2);}
@media (max-width:640px){
  .linhaCampo{grid-template-columns:22px 1fr;}
  .linhaCampo > :last-child{grid-column:2;}
}
#proto{position:fixed;left:0;right:0;bottom:0;z-index:99;height:var(--barra);
  padding-bottom:env(safe-area-inset-bottom);background:var(--tinta);color:var(--papel);
  display:flex;align-items:center;gap:10px;padding-left:12px;padding-right:12px;}
#proto .lab{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.55;flex:0 0 auto;}
#proto button{background:transparent;border:1px solid rgba(160,160,160,.5);color:var(--papel);
  height:28px;width:30px;font-size:14px;line-height:1;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;}
#proto select{flex:1 1 auto;min-width:0;height:28px;background:transparent;color:var(--papel);
  border:1px solid rgba(160,160,160,.5);font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;letter-spacing:.06em;padding:0 6px;}
#proto select option,#proto select optgroup{color:#111;background:#fff;}
@media (max-width:640px){ #proto .lab{display:none;} }
</style>
</head>
<body>
<main id="app"></main>
<div id="proto">
  <span class="lab">protótipo</span>
  <button id="pVoltar" title="Voltar">&#8249;</button>
  <select id="pTela"></select>
</div>
<script>
/* ---------- ícones ---------- */
const IC = {
  ok:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  alerta:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  nada:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
  arq:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  up:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>',
  play:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".35"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  mais:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  x:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".6"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  ant:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  prox:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  img:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".4"><rect x="3" y="3" width="18" height="18"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
};

/* ---------- peças de tela ---------- */
const cab = (t, sub, acoes) => `<div class="cabeca"><div><h1>${t}</h1>${
  sub ? `<p class="mudo" style="margin-top:7px;font-size:15px;">${sub}</p>` : ''}</div>${
  acoes ? `<div class="acoes">${acoes}</div>` : ''}</div>`;

const tabela = (cols, linhas) => `<table class="tab"><thead><tr>${
  cols.map(c => `<th class="rot">${c}</th>`).join('')}</tr></thead><tbody>${
  linhas.map(l => `<tr${l.ir ? ` class="clicavel" data-ir="${l.ir}"` : ''}>${
    l.c.map((v, i) => `<td data-r="${cols[i]}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

const bloco = (rot, val, forte) =>
  `<div class="${forte ? 'forte' : 'caixa'}" style="padding:17px 19px;">
     <div class="${forte ? 'rot-ink' : 'rot'}">${rot}</div>
     <div style="font-size:26px;font-weight:600;margin-top:5px;">${val}</div></div>`;

const secao = t => `<div class="secao">${t}</div>`;
const nada = t => `<div class="caixa" style="padding:34px 26px;text-align:center;">
  <div class="rot" style="margin-bottom:9px;">vazio</div><div style="font-size:16px;">${t}</div></div>`;
const linhasTexto = n => Array.from({length:n}, (_, i) =>
  `<div class="barrinha" style="width:${[100,94,88,71,52][i % 5]}%;"></div>`).join('');

/* ---------- casca ---------- */
const MENU_EQUIPE = [['inicio-equipe','Início'],['clientes','Clientes'],['aprovacoes','Aprovações'],
  ['agenda','Agenda'],['fila','Fila'],['financeiro','Financeiro'],['comercial','Comercial'],
  ['ajustes-equipe','Ajustes']];
const MENU_PORTAL = [['p-inicio','Início'],['p-aprovar','Para aprovar','4'],['p-projeto','Meu projeto'],
  ['p-calendario','Calendário'],['p-grid','Grid'],['p-campanhas','Campanhas'],['p-galeria','Galeria'],
  ['p-site','Meu site'],['p-acervo','Acervo'],['p-financeiro','Financeiro'],['p-contrato','Contrato'],
  ['p-feedback','Feedback']];
const ABAS_CLIENTE = [['c-visao','Visão geral'],['c-contrato','Contrato e serviços'],['c-marcos','Marcos'],

function barraMenu(itens, ativo, classe) {
  return `<div class="menu ${classe || ''}">${itens.map(([id, lab, selo]) =>
    `<span class="rot${id === ativo ? ' on' : ''}" data-ir="${id}">${lab}${
      selo ? ` <span class="selo">${selo}</span>` : ''}</span>`).join('')}</div>`;
}

function casca(t, id) {
  if (t.lado === 'nu') return t.html;
  const eq = t.lado === 'equipe';
  let h = `<div class="nameplate">
      <div><div class="marca">${eq ? 'Astart' : 'Mor Marcas'}</div>
      <div class="rot" style="margin-top:3px;">${eq ? 'Plataforma interna' : 'por Astart Studio'}</div></div>
      <div class="rot quem">${eq ? 'Layana &middot; operação' : 'Bruna Melo'}</div></div>`;
  h += barraMenu(eq ? MENU_EQUIPE : MENU_PORTAL, t.menu || id);
  if (t.abas === 'cliente') {
    h += `<div class="tituloCliente"><b>Mor Marcas</b>
      <span class="rot">gestão digital &middot; audiovisual &middot; website</span></div>`;
    h += barraMenu(ABAS_CLIENTE, id, 'abas');
  } else if (t.abas === 'ajustes') {
    h += barraMenu(ABAS_AJUSTES, id, 'abas');
  }
  return h + t.html;
}

const PECAS = {
  2:['Estático','Bastidores da fábrica','Publicado'],
  5:['Carrossel','3 erros na hora de escolher tecido','Publicado'],
  7:['Reels','Corte e costura em 15s','Publicado'],
  9:['Estático','Depoimento da Dona Marli','Publicado'],
  12:['Carrossel','Guia de tamanhos','Publicado'],
  14:['Estático','Nova coleção — teaser','Agendado'],
  16:['Carrossel','Como a peça é feita','Com ajustes'],
  19:['Reels','Making of da campanha','Em aprovação'],
  21:['Estático','Frase da semana','Em aprovação'],
  23:['Carrossel','Perguntas que mais recebemos','Em aprovação'],
  26:['Estático','Time por trás','Produzindo'],
  28:['Reels','Lançamento','Produzindo']
};
const FORTE = ['Com ajustes','Em aprovação'];
const SEM = ['qui','sex','sáb','dom','seg','ter','qua'];

function cartao(d, sel, pad) {
  const [tipo, tit, st] = PECAS[d];
  const peso = FORTE.includes(st) ? 'var(--tinta)' : 'var(--linha)';
  const marca = sel ? `<span style="float:right;width:14px;height:14px;border:1.5px solid var(--tinta);
    background:var(--tinta);color:var(--papel);display:inline-flex;align-items:center;justify-content:center;">
    <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>` : '';
  const ajuste = st === 'Com ajustes'
    ? `<div style="border-top:1px solid var(--linha2);margin-top:6px;padding-top:5px;font-size:11px;color:var(--texto2);">&ldquo;Trocar a foto do slide 3&rdquo;</div>` : '';
  return `<div style="border:1px solid var(--linha);border-left:3px solid ${peso};
    background:${sel ? 'var(--bloco)' : 'var(--sup)'};padding:${pad || '7px 8px'};">
    ${marca}<div class="rot">${tipo}</div>
    <div style="font-size:12px;line-height:1.3;margin:3px 0 5px;">${tit}</div>
    <div class="rot-ink">${st}</div>${ajuste}</div>`;
}

function gradeMes(sel) {
  sel = sel || [];
  const grade = [null,null,null,null].concat(Array.from({length:31}, (_, i) => i + 1));
  while (grade.length % 7) grade.push(null);
  let h = '<div class="mes">' +
    ['dom','seg','ter','qua','qui','sex','sáb'].map(d => `<div class="mesCab rot">${d}</div>`).join('');
  for (const d of grade) {
    if (d === null) { h += '<div class="mesCel vaziaCel"></div>'; continue; }
    const n = d === 13 ? `<span class="hoje">13</span>` : d;
    h += `<div class="mesCel"><div class="rot">${n}</div>${
      PECAS[d] ? cartao(d, sel.includes(d)) : ''}</div>`;
  }
  h += '</div><div class="dias">';
  for (const d of Object.keys(PECAS).map(Number).sort((a, b) => a - b)) {
    h += `<div class="diaLinha"><div class="diaSelo"><span class="rot">${SEM[(d - 1) % 7]}</span>
      <span style="font-size:19px;font-weight:600;">${d}</span></div>
      <div style="flex:1;min-width:0;">${cartao(d, sel.includes(d), '10px 12px')}</div></div>`;
  }
  return h + '</div>';
}

function tilesGrid() {
  const ordem = [28,26,23,21,19,16,14,12,9,7,5,2];
  return '<div class="tiles" id="tiles">' + ordem.map(d => {
    const [tipo, tit, st] = PECAS[d];
    const pub = st === 'Publicado';
    return `<div class="tile" style="border:${d === 16 ? '2px solid var(--tinta)' : '1px solid var(--linha)'};
      background:${pub ? 'var(--fraco)' : 'var(--fraco2)'};">
      <div style="display:flex;justify-content:space-between;gap:6px;">
        <span class="rot">${tipo}</span>${pub ? '<span class="rot">' + IC.ok + '</span>' : ''}</div>
      <div><div class="tileTit">${tit}</div><div class="rot" style="margin-top:3px;">${d}/10</div></div></div>`;
  }).join('') + '</div>';
}

  ['Entrada', ['entrar']],
  ['Equipe', ['inicio-equipe','clientes','vazio','aprovacoes','agenda','fila','financeiro','comercial']],
  ['Cadastro de cliente', ['novo-cliente','conferir','servicos','criado']],
  ['Ficha do cliente', ['c-visao','c-contrato','c-marcos','c-entregaveis','c-acervo','c-calendario',
    'c-grid','c-campanhas','c-redes','c-galeria','c-ambientes','c-manutencao','c-financeiro','c-feedbacks','editor']],
  ['Ajustes', ['ajustes-equipe','ajustes-servicos','ajustes-modelos']],
  ['Portal do cliente', ['p-inicio','p-aprovar','p-projeto','p-calendario','p-grid','p-campanhas',
    'p-galeria','p-site','p-acervo','p-financeiro','p-contrato','p-feedback']],
  ['Sem conta', ['link']]
];

(function () {
  const app = document.getElementById('app');
  const sel = document.getElementById('pTela');
  const pilha = [];
  let atual = null, n = 0;

  sel.innerHTML = GRUPOS.map(([g, ids]) => `<optgroup label="${g}">${ids.map(id => {
    n++; return `<option value="${id}">${n} &middot; ${T[id] ? T[id].rot : id}</option>`;
  }).join('')}</optgroup>`).join('');

  function irPara(id, guardar) {
    if (!T[id] || id === atual) return;
    if (guardar !== false && atual) pilha.push(atual);
    app.innerHTML = casca(T[id], id);
    app.dataset.tela = id;
    atual = id;
    sel.value = id;
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    const ir = e.target.closest('[data-ir]');
    if (ir) { irPara(ir.getAttribute('data-ir')); return; }

    const aba = e.target.closest('.tabsMob [data-aba]');
    if (aba) {
      document.getElementById('conferir').classList.toggle('verPdf', aba.dataset.aba === 'pdf');
      aba.parentNode.querySelectorAll('span').forEach(s => s.classList.remove('on'));
      aba.classList.add('on'); return;
    }

    if (e.target.closest('#btnConfirmaValor')) {
      document.getElementById('iconeValor').innerHTML = IC.ok;
      document.getElementById('acoesValor').style.display = 'none';
      document.getElementById('valorOk').style.display = 'block';
      const b = document.getElementById('btnContinuar');
      b.className = 'btn'; b.setAttribute('data-ir', 'servicos');
      document.getElementById('motivoTrava').style.display = 'none';
      return;
    }

    if (e.target.closest('#addCabeca')) {
      const lista = document.getElementById('addLista');
      const aberta = lista.style.display !== 'none';
      lista.style.display = aberta ? 'none' : 'block';
      document.getElementById('addSeta').innerHTML = aberta
        ? '<polyline points="6 9 12 15 18 9"/>' : '<polyline points="18 15 12 9 6 15"/>';
      return;
    }

    const f = e.target.closest('[data-grupo="formato"] .seg');
    if (f) {
      f.parentNode.querySelectorAll('.seg').forEach(s => s.classList.remove('on'));
      f.classList.add('on');
      const pontual = f.dataset.f === 'pon';
      document.querySelector('[data-lab="d1"]').textContent = pontual ? 'Data da captação' : 'Vencimento';
      document.querySelector('[data-lab="d2"]').textContent = pontual ? 'Entrega até' : 'Início';
      return;
    }

    const r = e.target.closest('#rede .seg');
    if (r) {
      r.parentNode.querySelectorAll('.seg').forEach(s => s.classList.remove('on'));
      r.classList.add('on');
      const tt = r.dataset.rede === 'tt';
      document.getElementById('tiles').classList.toggle('tiktok', tt);
      const p = document.getElementById('proporcao');
      if (p) p.textContent = tt ? '9:16 · 3 colunas' : '4:5 · 3 colunas';
      return;
    }

    const nota = e.target.closest('#nps [data-nota]');
    if (nota) {
      nota.parentNode.querySelectorAll('.seg').forEach(s => s.classList.remove('on'));
      nota.classList.add('on'); return;
    }

    const pa = e.target.closest('[data-ajuste]');
    if (pa) {
      const cx = pa.closest('.item').querySelector('.caixaAjuste');
      if (cx) cx.style.display = cx.style.display === 'block' ? 'none' : 'block';
      return;
    }
    const ca = e.target.closest('[data-cancela]');
    if (ca) { ca.closest('.caixaAjuste').style.display = 'none'; return; }

    const ap = e.target.closest('[data-aprovar]');
    if (ap) {
      const item = ap.closest('.item');
      if (item) item.remove();
      const faltam = document.querySelectorAll('.item').length;
      const selo = document.querySelector('.menu .on .selo');
      const sub = document.getElementById('subAprovar');
      if (selo) selo.textContent = faltam;
      if (sub) sub.textContent = faltam === 1
        ? '1 item enviado em 13/10 por Layana.'
        : faltam + ' itens enviados em 13/10 por Layana.';
      if (faltam === 0) {
        if (selo) selo.style.display = 'none';
        if (sub) sub.textContent = 'Nada pendente.';
        const fim = document.getElementById('tudoFeito');
        if (fim) fim.style.display = 'block';
      }
      return;
    }
  });

  document.getElementById('pVoltar').addEventListener('click', () => {
    const a = pilha.pop(); if (a) irPara(a, false);
  });
  sel.addEventListener('change', () => irPara(sel.value));
  irPara('entrar', false);
})();
</script></body></html>
